<html><head><style>body{margin:0}@keyframes hero-wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}.text-brand{color:#c41e1e}/* Hero line — a scooter accelerates left to right and the line is drawn in its wake.
   Line and rider share one accelerating curve, so the line's tip is always the front wheel. */
.hero-ride { --ride: 1.7s; --ride-delay: 0.55s; --ride-ease: cubic-bezier(0.62, 0.02, 0.98, 0.5);
  display: block; position: relative; height: 0.06em; margin-top: 0.85em; }
.hero-ride-line { position: absolute; inset: 0; background: hsl(0 0% 9%); transform-origin: left; animation: hero-wipe var(--ride) var(--ride-delay) var(--ride-ease) both; }
.hero-ride-bike { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; color: hsl(0 0% 9%); transform: translateX(-100%); animation: hero-ride var(--ride) var(--ride-delay) var(--ride-ease) both; }
.hero-ride-exit { display: block; transform: translateY(-0.02em); animation: hero-exit 0.45s calc(var(--ride-delay) + var(--ride)) cubic-bezier(0.5, 0, 1, 0.6) both; }
.hero-wheel { animation: hero-spin 0.22s linear calc(var(--ride) / 0.22 + 2); animation-delay: var(--ride-delay); }
@keyframes hero-ride { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes hero-exit { from { transform: translateX(0) translateY(-0.02em); opacity: 1; } to { transform: translateX(4em) translateY(-0.02em); opacity: 0; } }
@keyframes hero-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .hero-ride-line { animation: none; }
  .hero-ride-bike { display: none; }
}
